<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ray - glTF Viewer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #111; }
    #canvas-container { width: 100%; height: 100%; display: block; }
    #info {
      position: absolute; top: 12px; left: 12px;
      color: #0f0; font-family: monospace; font-size: 13px;
      background: rgba(0,0,0,0.7); padding: 8px 12px; border-radius: 4px;
      pointer-events: none; user-select: none;
    }
  </style>
</head>
<body>
  <div id="canvas-container"></div>
  <div id="info">ray viewer — loading...</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
